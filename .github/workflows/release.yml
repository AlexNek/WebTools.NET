# Release pipeline for the WebTools.NET NuGet package.
#
# On a v* tag push it builds, tests, packs and then publishes to:
#   1. NuGet.org      -> https://www.nuget.org/packages/WebTools.NET
#                        (requires repository secret NUGET_API_KEY)
#   2. GitHub Release -> tag page with the .nupkg attached
#
# workflow_dispatch ("Run workflow" button) runs build/test/pack ONLY;
# the publish job is skipped by design because it requires a v* tag.
name: Release & Publish NuGet

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: WebTools.NET/WebTools.NET.csproj
  TEST_PATH: WebTools.NET.Tests/WebTools.NET.Tests.csproj

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for GitVersion

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: '6.x'

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3
        with:
          useConfigFile: true

      - name: Display version
        run: |
          echo "SemVer: ${{ steps.gitversion.outputs.semVer }}"
          echo "NuGetVersion: ${{ steps.gitversion.outputs.nuGetVersionV2 }}"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore /p:Version=${{ steps.gitversion.outputs.nuGetVersionV2 }}

      - name: Test
        run: dotnet test ${{ env.TEST_PATH }} --configuration Release --no-build --verbosity normal --filter "Category!=Integration"

      - name: Pack
        run: dotnet pack ${{ env.PROJECT_PATH }} --configuration Release --no-build --output ./nupkg /p:PackageVersion=${{ steps.gitversion.outputs.nuGetVersionV2 }}

      - name: Upload NuGet artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./nupkg/*.nupkg

  publish:
    needs: build-and-test
    runs-on: ubuntu-latest
    # Skipped unless triggered by a v* tag push.
    # Manual workflow_dispatch runs are for build/test verification only.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download NuGet artifact
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: ./nupkg

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Check NuGet API key
        if: ${{ secrets.NUGET_API_KEY == '' }}
        run: |
          echo "::error::NUGET_API_KEY repository secret is not set."
          echo "Create an API key on nuget.org and add it under"
          echo "Settings -> Secrets and variables -> Actions, then re-run this release."
          exit 1

      - name: Announce publish targets
        run: |
          echo "Publishing WebTools.NET (${{ github.ref_name }}) to:"
          echo "  1. NuGet.org      -> https://www.nuget.org/packages/WebTools.NET"
          echo "  2. GitHub Release -> tag ${{ github.ref_name }}"

      - name: Publish to NuGet.org
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ./nupkg/*.nupkg
